# Run Purefile:        docker compose up
# Run the test suite:  docker compose run --rm test
services:
  purefile:
    build:
      context: .
      target: runtime
    image: ghcr.io/tzeytun/purefile:latest
    platform: linux/amd64
    ports:
      - "${PUREFILE_PORT:-8000}:8000"
    # Values come from the shell or a local .env file (see .env.example).
    environment:
      PUREFILE_MAX_IMAGE_MB: ${PUREFILE_MAX_IMAGE_MB:-50}
      PUREFILE_MAX_VIDEO_MB: ${PUREFILE_MAX_VIDEO_MB:-1024}
      PUREFILE_FILE_TTL_SECONDS: ${PUREFILE_FILE_TTL_SECONDS:-600}
      PUREFILE_SWEEP_INTERVAL_SECONDS: ${PUREFILE_SWEEP_INTERVAL_SECONDS:-60}
      PUREFILE_MAX_CONCURRENT_JOBS: ${PUREFILE_MAX_CONCURRENT_JOBS:-4}
      PUREFILE_TOOL_TIMEOUT_SECONDS: ${PUREFILE_TOOL_TIMEOUT_SECONDS:-600}
    # Files only ever live in memory-backed /tmp; the rest of the filesystem is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=${PUREFILE_TMPFS_SIZE:-3g},mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    platform: linux/amd64
    tmpfs:
      - /tmp:size=1g,mode=1777
