[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "purefile"
version = "0.1.0"
description = "Clean files. Nothing extra. Strip EXIF, IPTC, XMP and C2PA metadata from photos and videos without re-encoding."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tzeytun" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Tools for regenerating brand assets and fonts (scripts/build_brand.py, scripts/build_fonts.py).
brand = [
    "fonttools[woff]>=4.53",
    "numpy>=2.0",
    "pillow>=11.0",
    "playwright>=1.48",
    "potracer>=0.0.4",
]

[project.urls]
Homepage = "https://github.com/tzeytun/purefile"
Issues = "https://github.com/tzeytun/purefile/issues"

[tool.hatch.build.targets.wheel]
packages = ["purefile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = [
    "S603", # subprocess calls are made with fixed argument lists, never a shell
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S310"]
